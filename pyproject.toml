[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunnelgeopt"
version = "0.2.0"
description = "Physics-aware synthetic pre-training data for hard-rock tunnels"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "guzuhao494" }
]
dependencies = [
  "numpy>=1.26"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
elastic = [
  "scipy>=1.15,<2",
  "scikit-fem>=12,<13",
  "gmsh>=4.13,<5"
]
learn = [
  "torch>=2.8,<2.13"
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "scipy>=1.15,<2",
  "scikit-fem>=12,<13",
  "gmsh>=4.13,<5"
]

[project.scripts]
tunnelgeopt = "tunnelgeopt.cli:main"

[project.urls]
Repository = "https://github.com/guzuhao494/TunnelGeoPT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
